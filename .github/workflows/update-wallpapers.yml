name: Publish one reviewed wallpaper

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallpaper-catalog-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish one reviewed wallpaper into both catalog versions
        run: python tools/release_daily.py .
      - name: Commit and publish
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard releases/)" ]; then
            echo 'No change needed today.'
            exit 0
          fi
          git config user.name 'video-to-live-curator[bot]'
          git config user.email 'video-to-live-curator[bot]@users.noreply.github.com'
          git add catalog.json catalog-v2.json manifest.json studio/db62e673199e.json daily-reserve/queue.json releases/
          git commit -m 'content: publish one reviewed daily wallpaper'
          git push

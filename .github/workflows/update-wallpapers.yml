name: Update wallpaper collection

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallpaper-catalog-update
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r tools/requirements.txt
      - name: Validate reviewed queue
        run: python tools/validate_queue.py
      - name: Add the daily CC0 batch
        run: python tools/curate_commons.py --still-count 2 --video-count 1
      - name: Validate catalog
        run: python tools/validate_catalog.py
      - name: Commit published media and catalog
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "No eligible new media found."
            exit 0
          fi
          git config user.name "video-to-live-curator[bot]"
          git config user.email "video-to-live-curator[bot]@users.noreply.github.com"
          git add catalog.json manifest.json '*.jpg' '*.mp4'
          git commit -m "content: add daily CC0 wallpapers"
          git push

name: Update wallpaper collection

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      still_count:
        description: Still wallpapers to publish in this run
        required: true
        default: 4
        type: number
      video_count:
        description: Live wallpapers to publish in this run
        required: true
        default: 2
        type: number

permissions:
  contents: write

concurrency:
  group: wallpaper-catalog-update
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
          python -m pip install -r tools/requirements.txt
      - name: Validate reviewed queue
        run: python tools/validate_queue.py
      - name: Add the daily CC0 batch
        env:
          STILL_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.still_count || 4 }}
          VIDEO_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.video_count || 2 }}
        run: python tools/curate_commons.py --still-count "$STILL_COUNT" --video-count "$VIDEO_COUNT" --max-stills 120 --max-videos 40
      - name: Validate catalog
        run: python tools/validate_catalog.py
      - name: Commit published media and catalog
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "No eligible new media found."
            exit 0
          fi
          git config user.name "video-to-live-curator[bot]"
          git config user.email "video-to-live-curator[bot]@users.noreply.github.com"
          git add catalog.json manifest.json '*.jpg' '*.mp4'
          git commit -m "content: add daily CC0 wallpapers"
          git push
